# CI for this repository (REQ-007 P-23, AC-P23-1; ADR-009 Karar 11).
#
# Runs on windows-latest, the platform the application and its tests are
# developed on. Tests start their own embedded PostgreSQL (tests/helpers/
# pgCluster.ts, initdb --locale=C) and keep the network guard
# (tests/setup/networkGuard.ts); no PostgreSQL service and no secret is used.
#
# Hardening (AC-P23-5): read-only token, first-party actions/* only, each
# pinned to a full commit SHA (the tag is in the trailing comment), no
# privileged PR trigger, checkout does not persist the token.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: lint, typecheck, test, build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
