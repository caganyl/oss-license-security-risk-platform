plugins {
    id 'java-library'
    id 'org.springframework.boot' version '3.3.0'
}

ext {
    jacksonVersion = '2.17.1'
}

repositories {
    // https://repo.maven.apache.org/maven2 is not a dependency
    mavenCentral()
}

/*
 * implementation 'commented.out:block:1.0'
 */
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web:3.3.0'
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    api 'org.apache.commons:commons-lang3:3.14.0', 'commons-io:commons-io:2.16.1'
    implementation group: 'com.google.guava', name: 'guava', version: '33.2.0-jre'
    implementation group: 'org.slf4j', name: 'slf4j-api', version: slf4jVersion
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "com.fasterxml.jackson.core:jackson-core:$jacksonVersion"
    implementation 'io.netty:netty-all:4.1.+'
    implementation 'org.yaml:snakeyaml:latest.release'
    implementation 'joda-time:joda-time:[2.10,3.0)'
    implementation 'org.jetbrains:annotations:24.1.0!!'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14:tests@jar'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.3.0')
    implementation enforcedPlatform('io.micronaut:micronaut-bom:4.4.0')
    implementation project(':core')
    implementation files('libs/local.jar')
    implementation libs.retrofit
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'
    runtimeOnly 'org.postgresql:postgresql:42.7.3'
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    testImplementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'not-a-coordinate'

    constraints {
        implementation 'org.apache.logging.log4j:log4j-core:2.23.1'
    }
}

configurations.implementation {
    exclude group: 'commons-logging', module: 'commons-logging'
}
