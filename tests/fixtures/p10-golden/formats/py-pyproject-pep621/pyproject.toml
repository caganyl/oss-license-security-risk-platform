[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fixture-pep621"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "Flask==3.0.0",
  "numpy===1.26.4",
  "attrs",
  "pydantic[email]>=2.6; python_version >= '3.8'",
  "named-url @ https://example.invalid/named_url-1.0.tar.gz",
  "named-frag @ https://example.invalid/named_frag-1.0.tar.gz#sha256=0000",
  "typing_extensions==4.10.0",
  "-not-a-requirement",
  "git+https://github.com/example/vcs.git",
  "./local-path",
  "",
  "# only a comment",
  "spaced == 1.0.0",
  "wildcard==1.*",
  "python==3.11",
]

[project.optional-dependencies]
dev = ["pytest==8.1.1", "ruff>=0.3"]
docs = ["sphinx>=7.2,<8"]
empty = []

[project.scripts]
fixture = "fixture:main"
