[tool.poetry]
name = "fixture-poetry"
version = "0.1.0"
description = "REQ-003 P-10 format fixture"
authors = ["fixture <fixture@example.invalid>"]

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.31.0"
httpx = "0.27.0"
django = "4.2"
anyver = "*"
tilde = "~1.2"
eq = "==1.2.3"
eq-triple = "===2.0.0"
ranged = ">=1.0,<2.0"
spaced = " 1.2.3 "
postrel = "1.2.3.post1"
epoch = "1!2.0"
localver = "1.0+cpu"
prerel = "1.0a1"
vprefix = "v1.0.0"
oror = "1.0 || 2.0"
emptystr = ""
blankstr = "   "
Typing_Extensions = "4.10.0"
"zope.interface" = "6.2"
table-ver = { version = "^1.2", extras = ["socks"] }
table-exact = { version = "1.0.0", optional = true }
table-no-version = { optional = true }
table-git = { git = "https://github.com/example/table-git.git", rev = "v1.0.0" }
table-path = { path = "../local-lib", develop = true }
table-url = { url = "https://example.invalid/table_url-1.0.tar.gz" }
multi = [
  { version = "1.0.0", python = "<3.9" },
  { version = "2.0.0", python = ">=3.9" },
]
intver = 1

[tool.poetry.dev-dependencies]
pytest = "^8.0"
legacy-dev = "1.0.0"

[tool.poetry.group.dev.dependencies]
black = "24.1.0"
mypy = { version = "^1.9" }
python = "^3.11"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "1.5.3"

[tool.poetry.group.main.dependencies]
main-group-pkg = "2.0.0"

[tool.poetry.group.nodeps]
optional = true
